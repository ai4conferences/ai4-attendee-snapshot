name: Sync Ai4 attendee snapshot

on:
  schedule:
    # Mondays at 14:00 UTC (7am Pacific) — adjust to taste
    - cron: "0 14 * * 1"
  workflow_dispatch:  # lets you trigger manually from the Actions tab

permissions:
  contents: write  # needed to push the updated JSON back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Run sync
        env:
          SWAPCARD_API_KEY: ${{ secrets.SWAPCARD_API_KEY }}
          SWAPCARD_EVENT_ID: ${{ secrets.SWAPCARD_EVENT_ID }}
          INDUSTRY_FIELD_NAME: ${{ vars.INDUSTRY_FIELD_NAME }}
          TARGET_GROUPS: ${{ vars.TARGET_GROUPS }}
        run: python scripts/sync.py

      - name: Commit if changed
        run: |
          git config user.name  "ai4-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/snapshot.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh attendee snapshot ($(date -u +%Y-%m-%d))"
            git push
          fi
