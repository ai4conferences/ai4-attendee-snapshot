<!-- Ai4 attendee snapshot — paste into a Custom HTML block on /who-attends/ -->
<div id="ai4-snapshot" data-state="loading">
  <div class="ai4-toolbar"></div>
  <div class="ai4-loading">Loading attendee snapshot…</div>
  <div class="ai4-error" hidden>Couldn't load the snapshot. Try refreshing the page.</div>
  <ul class="ai4-companies" aria-label="Companies attending"></ul>
</div>

<style>
  #ai4-snapshot {
    --ai4-accent: #2D1B69;
    --ai4-accent-contrast: #FFFFFF;
    --ai4-button-text: #6B46C1;
    --ai4-button-border: #D8CCEC;
    --ai4-button-hover: #F4EFFB;
    --ai4-text: #1A1646;
    --ai4-muted: #6B7280;
    --ai4-card-bg: #FFFFFF;
    --ai4-card-shadow: 0 1px 3px rgba(20, 14, 60, 0.08);
    --ai4-card-radius: 12px;

    font-family: inherit;
    color: var(--ai4-text);
    line-height: 1.4;
    max-width: 1280px;
    margin: 0 auto;
    padding: 1rem 1.5rem 3rem;
  }
  #ai4-snapshot .ai4-toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.6rem;
    margin: 0.5rem 0 2rem;
  }
  #ai4-snapshot .ai4-filter {
    appearance: none;
    border: 1.5px solid var(--ai4-button-border);
    background: #FFFFFF;
    color: var(--ai4-button-text);
    padding: 0.6rem 1.1rem;
    border-radius: 8px;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  #ai4-snapshot .ai4-filter:hover {
    background: var(--ai4-button-hover);
    border-color: var(--ai4-accent);
  }
  #ai4-snapshot .ai4-filter.is-active {
    background: var(--ai4-accent);
    color: var(--ai4-accent-contrast);
    border-color: var(--ai4-accent);
  }
  #ai4-snapshot .ai4-loading,
  #ai4-snapshot .ai4-error {
    padding: 3rem 1rem;
    text-align: center;
    color: var(--ai4-muted);
    background: var(--ai4-card-bg);
    border-radius: var(--ai4-card-radius);
    box-shadow: var(--ai4-card-shadow);
  }
  #ai4-snapshot[data-state="ready"] .ai4-loading { display: none; }
  #ai4-snapshot[data-state="error"] .ai4-loading { display: none; }
  #ai4-snapshot[data-state="error"] .ai4-error { display: block; }
  #ai4-snapshot .ai4-companies {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.25rem;
  }
  #ai4-snapshot .ai4-companies li {
    background: var(--ai4-card-bg);
    border-radius: var(--ai4-card-radius);
    padding: 0.85rem 1.25rem;
    box-shadow: var(--ai4-card-shadow);
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--ai4-text);
    text-align: left;
    min-height: 2rem;
    display: flex;
    align-items: center;
  }
  #ai4-snapshot .ai4-companies li.is-empty {
    grid-column: 1 / -1;
    color: var(--ai4-muted);
    font-style: italic;
    background: transparent;
    box-shadow: none;
    padding: 1rem 0;
    justify-content: center;
  }
</style>

<script>
(function () {
  const SNAPSHOT_URL = "https://cdn.jsdelivr.net/gh/ai4conferences/ai4-attendee-snapshot@main/output/snapshot.json";
  const SHOW_ALL_LABEL = "All Industries";

  const root = document.getElementById("ai4-snapshot");
  if (!root) return;
  const toolbar = root.querySelector(".ai4-toolbar");
  const listEl  = root.querySelector(".ai4-companies");

  let snapshot = null;
  let activeIndustry = SHOW_ALL_LABEL;

  function render() {
    if (!snapshot) return;
    const filtered = activeIndustry === SHOW_ALL_LABEL
      ? snapshot.companies
      : snapshot.companies.filter(c => (c.industries || []).includes(activeIndustry));

    const cmp = (a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase());
    const ordered = filtered.filter(c => c.fortune500).sort(cmp)
      .concat(filtered.filter(c => !c.fortune500).sort(cmp));

    listEl.innerHTML = "";
    if (!ordered.length) {
      const li = document.createElement("li");
      li.className = "is-empty";
      li.textContent = "No companies in this category yet.";
      listEl.appendChild(li);
      return;
    }
    const frag = document.createDocumentFragment();
    for (const c of ordered) {
      const li = document.createElement("li");
      li.textContent = c.name;
      frag.appendChild(li);
    }
    listEl.appendChild(frag);
  }

  function buildIndustryButtons(industries) {
    const labels = [SHOW_ALL_LABEL].concat(industries.filter(i => i !== SHOW_ALL_LABEL));
    const frag = document.createDocumentFragment();
    labels.forEach(name => {
      const btn = document.createElement("button");
      btn.className = "ai4-filter" + (name === activeIndustry ? " is-active" : "");
      btn.dataset.industry = name;
      btn.textContent = name;
      frag.appendChild(btn);
    });
    toolbar.appendChild(frag);
  }

  toolbar.addEventListener("click", (e) => {
    const btn = e.target.closest(".ai4-filter");
    if (!btn) return;
    activeIndustry = btn.dataset.industry;
    toolbar.querySelectorAll(".ai4-filter").forEach(b =>
      b.classList.toggle("is-active", b === btn));
    render();
  });

  fetch(SNAPSHOT_URL, { cache: "no-cache"
